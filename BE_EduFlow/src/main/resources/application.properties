spring.application.name=backend

server.port=8888

# DB config
spring.datasource.url=jdbc:mysql://localhost:3306/eduflow_db?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.web.servlet=INFO

spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

spring.main.banner-mode=off

logging.level.root=warn

spring.jpa.hibernate.ddl-auto=update

spring.thymeleaf.check-template-location=false

# Authentication and payment secrets must be supplied by the environment.
# Prefer a dedicated JWT secret. Existing ECS environments can safely derive a
# domain-separated signing key from the already-injected datasource secret.
jwt.secret=${JWT_SECRET:${SPRING_DATASOURCE_PASSWORD:}}
vnpay.tmn-code=${VNPAY_TMN_CODE:}
vnpay.hash-secret=${VNPAY_HASH_SECRET:}
vnpay.url=${VNPAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
demo.instructor-password=${DEMO_INSTRUCTOR_PASSWORD:}

# Contact notification. Leave empty to store messages without sending email.
contact.notification-email=${CONTACT_NOTIFICATION_EMAIL:${MAIL_USERNAME:}}

# Tomcat performance tuning
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=20
server.tomcat.accept-count=100
server.tomcat.max-connections=8192

# Hikari Connection Pool performance tuning
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

