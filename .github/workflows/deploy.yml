name: Test and Deploy to Amazon ECS Fargate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: eduflow-${{ github.workflow }}-${{ github.ref }}
  # Only the newest main revision should reach production. Keeping stale runs
  # queued deploys old images before the actual fix and needlessly extends the
  # period in which users can still hit a known bug.
  cancel-in-progress: true

permissions:
  contents: read

env:
  AWS_REGION: ap-southeast-1
  ECS_CLUSTER: eduflow-dev-cluster
  FE_SERVICE: eduflow-dev-frontend
  BE_SERVICE: eduflow-dev-backend
  FE_ECR_REPO: eduflow-dev-frontend
  BE_ECR_REPO: eduflow-dev-backend

jobs:
  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: eduflow_db
          MYSQL_ROOT_PASSWORD: test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/eduflow_db?allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: test-password
      SPRING_MAIL_USERNAME: ci@example.invalid
      SPRING_MAIL_PASSWORD: unused-in-tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: BE_EduFlow/pom.xml

      - name: Run backend tests
        working-directory: BE_EduFlow
        run: mvn --batch-mode --no-transfer-progress test

  frontend-test:
    name: Frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: FE_EduFlow/pom.xml

      - name: Run frontend tests
        working-directory: FE_EduFlow
        run: mvn --batch-mode --no-transfer-progress test

      - name: Verify frontend runtime upload permissions
        working-directory: FE_EduFlow
        run: |
          set -euo pipefail

          for attempt in 1 2 3; do
            echo "Building frontend test image (attempt $attempt of 3)..."
            if docker build --tag eduflow-frontend-ci .; then
              break
            fi

            if [[ "$attempt" -eq 3 ]]; then
              echo "::error::Frontend image build failed after 3 attempts."
              exit 1
            fi

            delay=$((attempt * 15))
            echo "::warning::Docker build failed, retrying in ${delay}s."
            sleep "$delay"
          done

          docker run --rm --entrypoint sh eduflow-frontend-ci \
            -c 'test -d /app/uploads && test -w /app/uploads'

  terraform-validate:
    name: Terraform validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.7"

      - name: Check Terraform formatting
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Initialize Terraform without backend
        working-directory: terraform
        run: terraform init -backend=false -input=false

      - name: Validate Terraform
        working-directory: terraform
        run: terraform validate

  deploy:
    name: Build, push, and deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs:
      - backend-test
      - frontend-test
      - terraform-validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          # Fail fast on a transient or invalid STS credential check instead of
          # consuming the entire 45-minute deploy job through exponential retry.
          retry-max-attempts: 3
          action-timeout-s: 120

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push frontend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          for attempt in 1 2 3; do
            echo "Building frontend deployment image (attempt $attempt of 3)..."
            if docker build \
                -t "$ECR_REGISTRY/$FE_ECR_REPO:$IMAGE_TAG" \
                -t "$ECR_REGISTRY/$FE_ECR_REPO:latest" \
                ./FE_EduFlow; then
              break
            fi

            if [[ "$attempt" -eq 3 ]]; then
              echo "::error::Frontend deployment image build failed after 3 attempts."
              exit 1
            fi

            delay=$((attempt * 15))
            echo "::warning::Docker build failed, retrying in ${delay}s."
            sleep "$delay"
          done

          docker push "$ECR_REGISTRY/$FE_ECR_REPO:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$FE_ECR_REPO:latest"

      - name: Build and push backend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          for attempt in 1 2 3; do
            echo "Building backend deployment image (attempt $attempt of 3)..."
            if docker build \
                -t "$ECR_REGISTRY/$BE_ECR_REPO:$IMAGE_TAG" \
                -t "$ECR_REGISTRY/$BE_ECR_REPO:latest" \
                ./BE_EduFlow; then
              break
            fi

            if [[ "$attempt" -eq 3 ]]; then
              echo "::error::Backend deployment image build failed after 3 attempts."
              exit 1
            fi

            delay=$((attempt * 15))
            echo "::warning::Docker build failed, retrying in ${delay}s."
            sleep "$delay"
          done

          docker push "$ECR_REGISTRY/$BE_ECR_REPO:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$BE_ECR_REPO:latest"

      - name: Deploy ECS services
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$FE_SERVICE" \
            --force-new-deployment \
            --query 'service.{serviceName:serviceName,taskDefinition:taskDefinition,deployments:deployments[].{id:id,status:status,rolloutState:rolloutState,desiredCount:desiredCount,runningCount:runningCount,pendingCount:pendingCount}}' \
            --output json
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$BE_SERVICE" \
            --force-new-deployment \
            --query 'service.{serviceName:serviceName,taskDefinition:taskDefinition,deployments:deployments[].{id:id,status:status,rolloutState:rolloutState,desiredCount:desiredCount,runningCount:runningCount,pendingCount:pendingCount}}' \
            --output json

      - name: Wait for ECS services to stabilize
        shell: bash
        run: |
          set -uo pipefail

          if aws ecs wait services-stable \
              --cluster "$ECS_CLUSTER" \
              --services "$FE_SERVICE" "$BE_SERVICE"; then
            echo "Both ECS services reached a stable state."
            exit 0
          fi

          echo "::error::ECS services did not stabilize. Collecting service, task, target health, and application logs."
          set +e
          log_start_time=$(( $(date +%s) * 1000 - 20 * 60 * 1000 ))

          for service in "$FE_SERVICE" "$BE_SERVICE"; do
            echo "::group::ECS diagnostics: $service"

            aws ecs describe-services \
              --cluster "$ECS_CLUSTER" \
              --services "$service" \
              --query 'services[0].{serviceName:serviceName,taskDefinition:taskDefinition,desiredCount:desiredCount,runningCount:runningCount,pendingCount:pendingCount,deployments:deployments[].{id:id,status:status,rolloutState:rolloutState,rolloutStateReason:rolloutStateReason,desiredCount:desiredCount,runningCount:runningCount,pendingCount:pendingCount,failedTasks:failedTasks},events:events[0:10].[createdAt,message]}' \
              --output json

            stopped_tasks=$(aws ecs list-tasks \
              --cluster "$ECS_CLUSTER" \
              --service-name "$service" \
              --desired-status STOPPED \
              --max-results 10 \
              --query 'taskArns' \
              --output text)

            if [[ -n "$stopped_tasks" && "$stopped_tasks" != "None" ]]; then
              aws ecs describe-tasks \
                --cluster "$ECS_CLUSTER" \
                --tasks $stopped_tasks \
                --query 'tasks[].{taskArn:taskArn,taskDefinitionArn:taskDefinitionArn,lastStatus:lastStatus,stopCode:stopCode,stoppedReason:stoppedReason,containers:containers[].{name:name,lastStatus:lastStatus,exitCode:exitCode,reason:reason}}' \
                --output json
            else
              echo "No stopped tasks were returned for $service."
            fi

            target_group_arn=$(aws ecs describe-services \
              --cluster "$ECS_CLUSTER" \
              --services "$service" \
              --query 'services[0].loadBalancers[0].targetGroupArn' \
              --output text)

            if [[ -n "$target_group_arn" && "$target_group_arn" != "None" ]]; then
              aws elbv2 describe-target-health \
                --target-group-arn "$target_group_arn" \
                --query 'TargetHealthDescriptions[].{target:Target.Id,port:Target.Port,state:TargetHealth.State,reason:TargetHealth.Reason,description:TargetHealth.Description}' \
                --output json
            fi

            aws logs filter-log-events \
              --log-group-name "/ecs/$service" \
              --start-time "$log_start_time" \
              --limit 200 \
              --query 'events[].{timestamp:timestamp,message:message}' \
              --output json

            echo "::endgroup::"
          done

          exit 1
