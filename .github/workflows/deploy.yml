name: Test and Deploy to Amazon ECS Fargate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: eduflow-${{ github.workflow }}-${{ github.ref }}
  # Only the newest main revision should reach production. Keeping stale runs
  # queued deploys old images before the actual fix and needlessly extends the
  # period in which users can still hit a known bug.
  cancel-in-progress: true

permissions:
  contents: read

env:
  AWS_REGION: ap-southeast-1
  ECS_CLUSTER: eduflow-dev-cluster
  FE_SERVICE: eduflow-dev-frontend
  BE_SERVICE: eduflow-dev-backend
  FE_ECR_REPO: eduflow-dev-frontend
  BE_ECR_REPO: eduflow-dev-backend

jobs:
  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: eduflow_db
          MYSQL_ROOT_PASSWORD: test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/eduflow_db?allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: test-password
      SPRING_MAIL_USERNAME: ci@example.invalid
      SPRING_MAIL_PASSWORD: unused-in-tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: BE_EduFlow/pom.xml

      - name: Run backend tests
        working-directory: BE_EduFlow
        run: mvn --batch-mode --no-transfer-progress test

  frontend-test:
    name: Frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: FE_EduFlow/pom.xml

      - name: Run frontend tests
        working-directory: FE_EduFlow
        run: mvn --batch-mode --no-transfer-progress test

  terraform-validate:
    name: Terraform validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.7"

      - name: Check Terraform formatting
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Initialize Terraform without backend
        working-directory: terraform
        run: terraform init -backend=false -input=false

      - name: Validate Terraform
        working-directory: terraform
        run: terraform validate

  deploy:
    name: Build, push, and deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs:
      - backend-test
      - frontend-test
      - terraform-validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          # Fail fast on a transient or invalid STS credential check instead of
          # consuming the entire 45-minute deploy job through exponential retry.
          retry-max-attempts: 3
          action-timeout-s: 120

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push frontend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t "$ECR_REGISTRY/$FE_ECR_REPO:$IMAGE_TAG" \
            -t "$ECR_REGISTRY/$FE_ECR_REPO:latest" \
            ./FE_EduFlow
          docker push "$ECR_REGISTRY/$FE_ECR_REPO:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$FE_ECR_REPO:latest"

      - name: Build and push backend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t "$ECR_REGISTRY/$BE_ECR_REPO:$IMAGE_TAG" \
            -t "$ECR_REGISTRY/$BE_ECR_REPO:latest" \
            ./BE_EduFlow
          docker push "$ECR_REGISTRY/$BE_ECR_REPO:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$BE_ECR_REPO:latest"

      - name: Deploy ECS services
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$FE_SERVICE" \
            --force-new-deployment
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$BE_SERVICE" \
            --force-new-deployment

      - name: Wait for ECS services to stabilize
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$FE_SERVICE" "$BE_SERVICE"
