about.role_cto=Giám đốc công nghệ
about.team1.title=Đội ngũ sản phẩm
about.team1.desc=Thiết kế trải nghiệm học tập rõ ràng, ổn định dựa trên nhu cầu người học.
about.team2.title=Đội ngũ học thuật
about.team2.desc=Phối hợp cùng giảng viên để duy trì nội dung thực tế và chất lượng.
about.team3.title=Hỗ trợ người học
about.team3.desc=Hỗ trợ các vấn đề về tài khoản, đăng ký khóa học và quá trình học tập.
about.team4.title=Đội ngũ kỹ thuật
about.team4.desc=Xây dựng và vận hành nền tảng an toàn, dễ tiếp cận và đáng tin cậy.
faq.title=Câu hỏi thường gặp
faq.subtitle=Tìm câu trả lời nhanh về học tập và quản lý tài khoản EduFlow.
faq.q1=Làm thế nào để đăng ký một khóa học?
faq.a1=Mở trang chi tiết khóa học, xem nội dung và học phí, sau đó chọn Đăng ký học. Khi thanh toán được xác nhận, khóa học sẽ xuất hiện trong Khóa học của tôi.
faq.q2=Tôi có thể truy cập khóa học đã mua trong bao lâu?
faq.a2=Khóa học đã mua được duy trì trong tài khoản, trừ khi trang khóa học nêu rõ một thời hạn truy cập khác.
faq.q3=Làm thế nào để theo dõi tiến độ học tập?
faq.a3=Mở Khóa học của tôi, chọn khóa học và đánh dấu hoàn thành từng bài. EduFlow sẽ tự động cập nhật tiến độ của bạn.
faq.q4=Tôi quên mật khẩu thì phải làm gì?
faq.a4=Chọn Quên mật khẩu tại trang đăng nhập, xác thực email đã đăng ký bằng mã dùng một lần rồi tạo mật khẩu mới.
faq.q5=Làm thế nào để cập nhật hoặc xóa tài khoản?
faq.a5=Đăng nhập và mở phần cài đặt tài khoản. Tại đây bạn có thể cập nhật hồ sơ, đổi mật khẩu hoặc vô hiệu hóa tài khoản.
faq.q6=Làm sao liên hệ giảng viên hoặc bộ phận hỗ trợ EduFlow?
faq.a6=Hãy dùng trang Liên hệ và ghi rõ tên khóa học cùng mô tả vấn đề để đội ngũ hỗ trợ xử lý nhanh chóng.
faq.more_help=Bạn vẫn cần hỗ trợ?
faq.contact_us=Liên hệ EduFlow
