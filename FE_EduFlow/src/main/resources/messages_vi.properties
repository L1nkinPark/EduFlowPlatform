career.open_positions_desc=Chọn vị trí phù hợp với thế mạnh của bạn và cùng chúng tôi cải thiện trải nghiệm học trực tuyến.
career.open=Đang tuyển
career.location=Làm việc kết hợp / từ xa tại Việt Nam
career.job1.title=Nhà thiết kế UI/UX
career.job1.desc=Thiết kế trải nghiệm học tập rõ ràng, dễ tiếp cận trên giao diện web và di động.
career.job2.title=Lập trình viên Full-stack
career.job2.desc=Xây dựng tính năng ổn định với Spring Boot, công nghệ web và hạ tầng đám mây.
career.job3.title=Chuyên viên hỗ trợ kỹ thuật
career.job3.desc=Hỗ trợ học viên và giảng viên xử lý vấn đề sản phẩm tận tâm và chính xác.
career.job4.title=Chuyên viên nội dung đào tạo
career.job4.desc=Phối hợp với giảng viên xây dựng nội dung khóa học có cấu trúc, thực tiễn và hấp dẫn.
