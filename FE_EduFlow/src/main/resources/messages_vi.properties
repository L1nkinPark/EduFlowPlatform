privacy.title=Chính sách bảo mật
privacy.updated=Cập nhật lần cuối: Tháng 8 năm 2026
privacy.intro=Chính sách này giải thích dữ liệu cá nhân EduFlow thu thập, mục đích sử dụng và các lựa chọn dành cho bạn.
privacy.s1.title=1. Thông tin chúng tôi thu thập
privacy.s1.text=Chúng tôi có thể thu thập thông tin tài khoản, hồ sơ, hoạt động khóa học, yêu cầu hỗ trợ, đơn hàng và dữ liệu kỹ thuật cần thiết để vận hành nền tảng.
privacy.s2.title=2. Cách chúng tôi sử dụng thông tin
privacy.s2.text=Dữ liệu được dùng để cung cấp tài khoản và khóa học, xử lý đơn hàng, theo dõi tiến độ, gửi thông báo cần thiết, ngăn chặn lạm dụng và cải thiện EduFlow.
privacy.s3.title=3. Cookie và phiên đăng nhập
privacy.s3.text=Cookie thiết yếu giúp duy trì đăng nhập, lưu ngôn ngữ và bảo vệ phiên. Bạn có thể xóa cookie trong trình duyệt nhưng một số chức năng có thể ngừng hoạt động.
privacy.s4.title=4. Chia sẻ dữ liệu và nhà cung cấp dịch vụ
privacy.s4.text=Dữ liệu chỉ được chia sẻ với nhà cung cấp cần thiết cho lưu trữ, email, thanh toán hoặc theo yêu cầu pháp luật. EduFlow không bán dữ liệu cá nhân.
privacy.s5.title=5. Lưu trữ và thời hạn giữ dữ liệu
privacy.s5.text=Chúng tôi chỉ giữ thông tin trong thời gian cần thiết cho dịch vụ, nghĩa vụ pháp lý, giải quyết tranh chấp và chống gian lận, sau đó xóa hoặc ẩn danh dữ liệu.
privacy.s6.title=6. Bảo mật
privacy.s6.text=EduFlow áp dụng kiểm soát truy cập, mã hóa mật khẩu và kết nối mã hóa khi có thể. Không dịch vụ internet nào có thể bảo đảm an toàn tuyệt đối.
privacy.s7.title=7. Quyền của bạn
privacy.s7.text=Bạn có thể yêu cầu truy cập, chỉnh sửa hoặc xóa dữ liệu cá nhân và có thể vô hiệu hóa tài khoản, tùy theo yêu cầu lưu trữ của pháp luật.
privacy.s8.title=8. Trẻ em và thay đổi chính sách
privacy.s8.text=Người dùng phải đáp ứng độ tuổi tối thiểu theo pháp luật áp dụng. Thay đổi quan trọng sẽ được công bố tại trang này cùng ngày cập nhật mới.
privacy.contact_title=Liên hệ và yêu cầu về quyền riêng tư
privacy.contact_text=Nếu có câu hỏi hoặc yêu cầu về dữ liệu cá nhân, hãy dùng biểu mẫu liên hệ.
privacy.contact_link=Liên hệ EduFlow
terms.title=Điều khoản và điều kiện
terms.updated=Cập nhật lần cuối: Tháng 8 năm 2026
terms.intro=Các điều khoản này điều chỉnh việc truy cập EduFlow. Khi tạo tài khoản hoặc sử dụng nền tảng, bạn đồng ý tuân thủ các điều khoản này.
terms.s1.title=1. Tài khoản
terms.s1.text=Hãy cung cấp thông tin chính xác, bảo mật thông tin đăng nhập và báo cho EduFlow nếu nghi ngờ truy cập trái phép. Bạn chịu trách nhiệm về hoạt động trong tài khoản.
terms.s2.title=2. Khóa học và quyền truy cập
terms.s2.text=Mô tả, học phí và tài liệu đi kèm được hiển thị trước khi đăng ký. Quyền truy cập dành riêng cho cá nhân và không được chuyển giao hoặc chia sẻ nếu chưa được phép.
terms.s3.title=3. Đơn hàng và thanh toán
terms.s3.text=Thanh toán được xử lý bởi nhà cung cấp hiển thị trên hệ thống. Việc đăng ký chỉ được xác nhận khi EduFlow nhận thông báo thanh toán thành công.
terms.s4.title=4. Sử dụng được chấp nhận
terms.s4.text=Không được phá hoại nền tảng, vượt qua kiểm soát truy cập, thu thập dữ liệu được bảo vệ, tải nội dung độc hại, mạo danh hoặc vi phạm pháp luật.
terms.s5.title=5. Nội dung của người dùng và giảng viên
terms.s5.text=Bạn giữ quyền sở hữu nội dung đã gửi và cấp cho EduFlow quyền giới hạn cần thiết để lưu trữ và hiển thị. Nội dung phải tôn trọng quyền của bên thứ ba.
terms.s6.title=6. Quyền sở hữu trí tuệ
terms.s6.text=Phần mềm, thương hiệu và tài liệu nền tảng EduFlow được bảo vệ. Tài liệu khóa học chỉ được dùng cho việc học cá nhân trừ khi chủ sở hữu cho phép thêm.
terms.s7.title=7. Tạm ngưng và chấm dứt
terms.s7.text=EduFlow có thể giới hạn hoặc chấm dứt truy cập khi có vi phạm nghiêm trọng hoặc lặp lại. Bạn có thể vô hiệu hóa tài khoản trong phần cài đặt.
terms.s8.title=8. Tính sẵn sàng và giới hạn trách nhiệm
terms.s8.text=Chúng tôi nỗ lực duy trì EduFlow ổn định nhưng không thể cam kết hoạt động không gián đoạn. Trách nhiệm được giới hạn trong phạm vi pháp luật cho phép.
terms.s9.title=9. Thay đổi và pháp luật áp dụng
terms.s9.text=Điều khoản cập nhật sẽ được công bố tại trang này. Các điều khoản được điều chỉnh theo pháp luật Việt Nam và quy định bảo vệ người tiêu dùng áp dụng.
terms.contact_title=Câu hỏi về điều khoản
terms.contact_text=Nếu có nội dung chưa rõ, hãy liên hệ với chúng tôi trước khi sử dụng dịch vụ.
terms.contact_link=Liên hệ EduFlow
