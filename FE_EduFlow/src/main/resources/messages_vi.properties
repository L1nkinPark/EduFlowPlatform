about.vision_desc=Đưa giáo dục chất lượng cao đến với mọi người, dù họ ở bất kỳ đâu.
about.mission_title=Sứ mệnh của chúng tôi
about.mission_desc=Cung cấp khóa học thực tiễn, đáng tin cậy để người học xây dựng kỹ năng và phát triển sự nghiệp.
about.team_title=Gặp gỡ đội ngũ
about.team_desc=Tận tâm vì chất lượng và thành công của bạn
