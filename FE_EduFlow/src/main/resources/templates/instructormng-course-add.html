<!DOCTYPE html>
<html lang="en" th:lang="${#locale.language}" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" th:href="@{/img/icon.png}">
    <title th:text="#{instructor.course_form}">Course Form</title>

    <link th:href="@{/css/style.css}" rel="stylesheet">
    <link th:href="@{/vendor/icofont/icofont.min.css}" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/cdn.jsdelivr.net/npm/bootstrap-icons%401.7.1/font/bootstrap-icons.css}">
    <link th:href="@{/css/instructor-editor.css}" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{layouts/layout :: instructor_header}"></div>

<section class="py-3 border-bottom bg-white shadow-sm">
    <div class="container">
        <h4 class="mb-0" th:text="${course.courseId != null and !course.courseId.isEmpty()} ? #{instructor.edit_course} : #{instructor.new_course}">New Course</h4>
        <p class="text-muted mb-0" th:text="#{instructor.course_form_desc}">Basic course information</p>
    </div>
</section>

<div class="pt-5 pb-5">
    <div class="container">
        <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card border-light">
                    <div class="card-body">
                        <form th:action="@{/instructor/courses/add}" method="POST" enctype="multipart/form-data" th:object="${course}" id="courseForm">
                            <input type="hidden" th:field="*{courseId}">
                            <input type="hidden" th:field="*{thumbnail}">

                            <div class="mb-3">
                                <label class="form-label" th:text="#{instructor.course_name}">Course name</label>
                                <input type="text" class="form-control" th:field="*{courseName}" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label" th:text="#{common.description}">Description</label>
                                <textarea rows="3" class="form-control" th:field="*{description}"></textarea>
                            </div>

                            <div class="row">
                                <div class="col-md-12 mb-4">
                                    <label class="form-label" th:text="#{instructor.category}">Course category</label>
                                    <select class="form-select" th:field="*{subCategoryId}" required>
                                        <option value="" th:text="#{instructor.select_category}">Select category</option>
                                        <option th:each="subCategory : ${subCategories}"
                                                th:value="${subCategory.subCategoryId}"
                                                th:text="${subCategory.category != null
                                                ? subCategory.category.categoryName + ' — ' + subCategory.subCategoryName
                                                : subCategory.subCategoryName}">
                                            Category
                                        </option>
                                    </select>
                                    <div class="form-text" th:text="#{instructor.category_hint}">Choose the correct category.</div>
                                </div>
                            </div>

                            <section class="mb-4">
                                <label class="form-label fw-semibold" th:text="#{instructor.course_cover}">Ảnh bìa khóa học</label>
                                <div class="row g-3 align-items-start">
                                    <div class="col-md-7">
                                        <div class="cover-source-tabs" role="tablist">
                                            <button type="button" class="active" id="coverUrlTab">
                                                <i class="bi bi-link-45deg"></i> <span th:text="#{instructor.cover_from_url}">Dán URL ảnh</span>
                                            </button>
                                            <button type="button" id="coverUploadTab">
                                                <i class="bi bi-cloud-arrow-up"></i> <span th:text="#{instructor.cover_upload}">Tải ảnh lên</span>
                                            </button>
                                        </div>
                                        <div id="coverUrlPanel">
                                            <input id="coverUrl" type="text" inputmode="url" class="form-control" th:field="*{image}"
                                                   placeholder="https://example.com/anh-khoa-hoc.jpg">
                                            <span class="form-hint" th:text="#{instructor.cover_url_hint}">Dùng link HTTPS trực tiếp đến ảnh. Bản xem trước sẽ xuất hiện bên cạnh.</span>
                                            <div id="coverUrlError" class="text-danger small mt-2" hidden th:text="#{instructor.cover_url_error}">Không tải được ảnh từ URL này.</div>
                                        </div>
                                        <div id="coverUploadPanel" hidden>
                                            <label class="upload-zone py-3" for="coverFile">
                                                <i class="bi bi-image"></i>
                                                <strong th:text="#{instructor.cover_upload_action}">Chọn ảnh từ máy</strong>
                                                <span th:text="#{instructor.cover_upload_hint}">JPG, PNG, WEBP hoặc GIF · tối đa 5 MB</span>
                                                <input id="coverFile" name="coverFile" type="file" accept="image/jpeg,image/png,image/webp,image/gif">
                                            </label>
                                            <div class="selected-file" id="selectedCover"><i class="bi bi-file-earmark-image"></i><span></span></div>
                                        </div>
                                    </div>
                                    <div class="col-md-5">
                                        <div class="cover-preview" id="coverPreview">
                                            <img id="coverPreviewImage"
                                                 th:src="${course.image != null and !#strings.isEmpty(course.image) ? course.image : course.thumbnail}"
                                                 th:alt="#{instructor.cover_preview}" referrerpolicy="no-referrer" hidden>
                                            <div class="cover-preview-empty" id="coverPreviewEmpty"><i class="bi bi-image"></i><span th:text="#{instructor.cover_preview}">Xem trước ảnh bìa</span></div>
                                        </div>
                                    </div>
                                </div>
                            </section>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label" th:text="#{instructor.start_date}">Start date</label>
                                    <input type="date" class="form-control" th:field="*{startDate}">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label" th:text="#{instructor.end_date}">End date</label>
                                    <input type="date" class="form-control" th:field="*{endDate}">
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label" th:text="#{common.status}">Status</label>
                                    <select class="form-select" th:field="*{status}">
                                        <option value="ACTIVE" th:text="#{common.active}">Active</option>
                                        <option value="INACTIVE" th:text="#{common.inactive}">Inactive</option>
                                        <option value="DRAFT" th:text="#{common.draft}">Draft</option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label" th:text="#{common.vnd_price}">Price (VND)</label>
                                    <input type="number" step="1000" min="0" class="form-control" th:field="*{price}">
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100" th:text="#{instructor.save_course}">Save course</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<footer class="py-4 bg-white border-top text-center small text-muted">
    <div class="container">©2026 EduFlow Instructor Panel</div>
</footer>

<script th:src="@{/vendor/jquery/jquery.min.js}"></script>
<script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script th:inline="javascript">
    document.addEventListener('DOMContentLoaded', function () {
        const urlTab = document.getElementById('coverUrlTab');
        const uploadTab = document.getElementById('coverUploadTab');
        const urlPanel = document.getElementById('coverUrlPanel');
        const uploadPanel = document.getElementById('coverUploadPanel');
        const urlInput = document.getElementById('coverUrl');
        const fileInput = document.getElementById('coverFile');
        const previewImage = document.getElementById('coverPreviewImage');
        const previewEmpty = document.getElementById('coverPreviewEmpty');
        const urlError = document.getElementById('coverUrlError');
        const selectedCover = document.getElementById('selectedCover');
        let objectUrl;

        function selectSource(source) {
            const usingUrl = source === 'url';
            urlTab.classList.toggle('active', usingUrl);
            uploadTab.classList.toggle('active', !usingUrl);
            urlPanel.hidden = !usingUrl;
            uploadPanel.hidden = usingUrl;
            urlInput.disabled = !usingUrl;
            if (usingUrl) {
                fileInput.value = '';
                selectedCover.classList.remove('show');
                updateUrlPreview();
            }
        }

        function showPreview(source) {
            if (!source) {
                previewImage.hidden = true;
                previewEmpty.hidden = false;
                return;
            }
            previewImage.hidden = false;
            previewEmpty.hidden = true;
            previewImage.src = source;
        }

        function updateUrlPreview() {
            const value = urlInput.value.trim();
            urlError.hidden = true;
            showPreview(value);
        }

        urlTab.addEventListener('click', () => selectSource('url'));
        uploadTab.addEventListener('click', () => selectSource('upload'));
        urlInput.addEventListener('input', updateUrlPreview);
        previewImage.addEventListener('load', () => { urlError.hidden = true; });
        previewImage.addEventListener('error', () => {
            previewImage.hidden = true;
            previewEmpty.hidden = false;
            if (!urlInput.disabled && urlInput.value.trim()) urlError.hidden = false;
        });
        fileInput.addEventListener('change', function () {
            const file = fileInput.files[0];
            selectedCover.classList.toggle('show', Boolean(file));
            selectedCover.querySelector('span').textContent = file ? file.name : '';
            if (objectUrl) URL.revokeObjectURL(objectUrl);
            objectUrl = file ? URL.createObjectURL(file) : null;
            showPreview(objectUrl);
        });

        if (previewImage.getAttribute('src')) showPreview(previewImage.getAttribute('src'));
    });
</script>
</body>
</html>
