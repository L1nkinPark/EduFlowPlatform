<!DOCTYPE html>
<html lang="en" th:lang="${#locale.language}" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" th:href="@{/img/icon.png}">
    <title th:text="#{instructor.my_courses}">My Courses</title>

    <link th:href="@{/css/style.css}" rel="stylesheet">
    <link th:href="@{/vendor/icofont/icofont.min.css}" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/cdn.jsdelivr.net/npm/bootstrap-icons%401.7.1/font/bootstrap-icons.css}">
</head>
<body class="bg-light">
<div th:replace="~{layouts/layout :: instructor_header}"></div>

<section class="py-3 border-bottom bg-white shadow-sm">
    <div class="container d-flex justify-content-between align-items-center">
        <div>
            <h4 class="mb-0" th:text="#{instructor.my_courses}">My Courses</h4>
            <p class="text-muted mb-0" th:text="#{instructor.my_courses_desc}">Courses you teach</p>
        </div>
        <a class="btn btn-primary" th:href="@{/instructor/courses/add}">
            <i class="bi bi-plus-lg"></i> <span th:text="#{nav.new_course}">New Course</span>
        </a>
    </div>
</section>

<div class="pt-5 pb-5">
    <div class="container">
        <div th:if="${success}" class="alert alert-success" role="status" th:text="${success}"></div>
        <div class="card border-light">
            <div class="p-0 card-body">
                <div class="table-responsive border-0">
                    <table class="mb-0 text-nowrap table">
                        <thead class="table-light">
                        <tr>
                            <th scope="col" class="border-0" th:text="#{common.course}">Course</th>
                            <th scope="col" class="border-0" th:text="#{common.price}">Price</th>
                            <th scope="col" class="border-0" th:text="#{common.chapters}">Chapters</th>
                            <th scope="col" class="border-0" th:text="#{common.status}">Status</th>
                            <th scope="col" class="border-0" th:text="#{common.actions}">Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${courseList.isEmpty()}">
                            <td colspan="5" class="text-center text-muted py-5">
                                <span th:text="#{instructor.course_empty}">You do not have any courses yet.</span>
                                <a th:href="@{/instructor/courses/add}" th:text="#{instructor.create_first}">Create your first course</a>
                            </td>
                        </tr>
                        <tr th:each="course : ${courseList}">
                            <td>
                                <div class="d-flex align-items-center">
                                    <img th:src="${course.thumbnail != null && !#strings.isEmpty(course.thumbnail) ? course.thumbnail : course.image}"
                                         class="rounded img-4by3-sm" style="width:60px;height:45px;object-fit:cover;" referrerpolicy="no-referrer"
                                         onerror="this.onerror=null;this.src='/img/globel/b1.jpg'" alt="">
                                    <h5 class="mb-0 ms-3" th:text="${course.courseName}">Course name</h5>
                                </div>
                            </td>
                            <td th:text="${@vndCurrency.format(course.price)}">0 ₫</td>
                            <td th:text="${course.chapters != null ? course.chapters.size() : 0}">0</td>
                            <td>
                                <span class="badge bg-success" th:text="${course.status}">ACTIVE</span>
                            </td>
                            <td>
                                <a class="btn btn-sm btn-outline-primary" th:href="@{/instructor/courses/content(courseId=${course.courseId})}">
                                    <i class="bi bi-collection-play"></i> <span th:text="#{instructor.manage_content}">Manage Content</span>
                                </a>
                                <a class="btn btn-sm btn-outline-secondary" th:href="@{/instructor/courses/add(courseId=${course.courseId})}">
                                    <span th:text="#{common.edit}">Edit</span>
                                </a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<footer class="py-4 bg-white border-top text-center small text-muted">
    <div class="container">©2026 EduFlow Instructor Panel</div>
</footer>

<script th:src="@{/vendor/jquery/jquery.min.js}"></script>
<script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
