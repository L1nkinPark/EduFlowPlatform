<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" th:href="@{/img/icon.png}">
    <title>Security - Edutree</title>

    <link th:href="@{/css/style.css}" rel="stylesheet">
    <link th:href="@{/vendor/icofont/icofont.min.css}" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/cdn.jsdelivr.net/npm/bootstrap-icons%401.7.1/font/bootstrap-icons.css}">
</head>
<body class="bg-light">
<div th:replace="~{layouts/layout :: header_2}"></div>

<section class="py-3 border-bottom bg-white shadow-sm">
    <div class="container">
        <h4 class="mb-0">Security</h4>
        <p class="text-muted mb-0">Quản lý mật khẩu và bảo mật tài khoản</p>
    </div>
</section>

<div class="pt-5 pb-5">
    <div class="container">
        <div class="row">
            <div class="col-lg-3 col-md-4 col-sm-12">
                <div th:replace="~{layouts/layout :: student_sidebar(active='security')}"></div>
            </div>
            <div class="col-lg-9 col-md-8 col-sm-12">
                <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                <div class="border-0 card">
                    <div class="card-header">
                        <h3 class="mb-0">Email Address</h3>
                    </div>
                    <div class="card-body">
                        <p>Email hiện tại của bạn là <span class="text-success fw-bold" th:text="${account.email}">email@example.com</span></p>
                        <p class="text-muted small mb-0">Để thay đổi email, vui lòng liên hệ hỗ trợ.</p>
                    </div>
                </div>

                <div class="border-0 mt-4 card">
                    <div class="card-header">
                        <h3 class="mb-0">Change Password</h3>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/student/security}" method="post">
                            <div class="row">
                                <div class="col-lg-6 col-md-12 col-sm-12">
                                    <div class="mb-3">
                                        <label class="form-label">Current Password</label>
                                        <input required type="password" name="currentPassword" class="form-control">
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">New Password</label>
                                        <input required type="password" name="newPassword" class="form-control" minlength="6">
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Confirm New Password</label>
                                        <input required type="password" name="confirmPassword" class="form-control" minlength="6">
                                    </div>
                                    <button type="submit" class="btn btn-primary">Save Password</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<footer class="py-4 bg-white border-top text-center small text-muted">
    <div class="container">©2026 Edutree</div>
</footer>

<script th:src="@{/vendor/jquery/jquery.min.js}"></script>
<script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
