<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" th:href="@{/img/icon.png}">
    <title>Order History - Edutree</title>

    <link th:href="@{/css/style.css}" rel="stylesheet">
    <link th:href="@{/vendor/icofont/icofont.min.css}" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/cdn.jsdelivr.net/npm/bootstrap-icons%401.7.1/font/bootstrap-icons.css}">
</head>
<body class="bg-light">
<div th:replace="~{layouts/layout :: header_2}"></div>

<section class="py-3 border-bottom bg-white shadow-sm">
    <div class="container">
        <h4 class="mb-0">Order History</h4>
        <p class="text-muted mb-0">Danh sách các đơn hàng bạn đã thanh toán thành công</p>
    </div>
</section>

<div class="pt-5 pb-5">
    <div class="container">
        <div class="row">
            <div class="col-lg-3 col-md-4 col-sm-12">
                <div th:replace="~{layouts/layout :: student_sidebar(active='invoice')}"></div>
            </div>
            <div class="col-lg-9 col-md-8 col-sm-12">
                <div class="border-0 card">
                    <div class="card-header">
                        <h3 class="mb-0">Invoices</h3>
                        <p class="mb-0 text-muted small">Danh sách các đơn hàng đã thanh toán thành công.</p>
                    </div>
                    <div class="p-0 card-body">
                        <div class="table-invoice table-responsive border-0" th:if="${not #lists.isEmpty(orders)}">
                            <table class="table mb-0 text-nowrap table">
                                <thead class="table-light">
                                    <tr>
                                        <th scope="col" class="border-bottom-0">ORDER ID</th>
                                        <th scope="col" class="border-bottom-0">DATE</th>
                                        <th scope="col" class="border-bottom-0">COURSES</th>
                                        <th scope="col" class="border-bottom-0">AMOUNT</th>
                                        <th scope="col" class="border-bottom-0">STATUS</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="order : ${orders}">
                                        <td th:text="'#' + ${order.orderId}">#1008</td>
                                        <td th:text="${#dates.format(order.orderDate, 'dd MMM yyyy, HH:mm')}">17 April 2022, 10:45pm</td>
                                        <td th:text="${#strings.listJoin(order.courseNames, ', ')}">Course names</td>
                                        <td th:text="${#numbers.formatDecimal(order.totalAmount, 1, 0) + ' VND'}">39</td>
                                        <td><span class="badge bg-success">Complete</span></td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        <div class="text-center py-5" th:if="${#lists.isEmpty(orders)}">
                            <p class="text-muted mb-3">Bạn chưa có đơn hàng nào.</p>
                            <a th:href="@{/course/all}" class="btn btn-outline-primary btn-sm">Khám phá khóa học</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<footer class="py-4 bg-white border-top text-center small text-muted">
    <div class="container">©2026 Edutree</div>
</footer>

<script th:src="@{/vendor/jquery/jquery.min.js}"></script>
<script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
