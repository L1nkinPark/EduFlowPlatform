<!DOCTYPE html>
<html lang="en" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" th:href="@{/img/icon.png}">
    <title th:text="#{page.privacy_title}">Privacy policy - EduFlow</title>
    <meta name="description" th:content="#{privacy.intro}" content="EduFlow privacy policy">
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <link th:href="@{/vendor/icofont/icofont.min.css}" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/cdn.jsdelivr.net/npm/bootstrap-icons%401.7.1/font/bootstrap-icons.css}">
</head>
<body class="bg-light">
<div th:replace="~{layouts/layout :: header_2}"></div>
<header class="py-5 bg-primary text-center text-white">
    <div class="container py-4">
        <h1 class="display-5 fw-bold" th:text="#{privacy.title}">Privacy policy</h1>
        <p class="lead text-white-50 mb-0" th:text="#{privacy.updated}">Last updated: August 2026</p>
    </div>
</header>
<main class="container py-5">
    <article class="bg-white rounded-3 shadow-sm p-4 p-lg-5 mx-auto" style="max-width: 960px">
        <p class="lead" th:text="#{privacy.intro}">This policy explains how EduFlow handles personal data.</p>
        <section th:each="number : ${#numbers.sequence(1, 8)}" class="mt-4">
            <h2 class="h5 fw-bold" th:text="#{__${'privacy.s' + number + '.title'}__}">Section</h2>
            <p class="text-muted mb-0" th:text="#{__${'privacy.s' + number + '.text'}__}">Details</p>
        </section>
        <section class="mt-4">
            <h2 class="h5 fw-bold" th:text="#{privacy.contact_title}">Contact</h2>
            <p class="text-muted"><span th:text="#{privacy.contact_text}">Contact us for privacy requests.</span>
                <a th:href="@{/contact}" th:text="#{privacy.contact_link}">Contact EduFlow</a>
            </p>
        </section>
    </article>
</main>
<div th:replace="~{layouts/layout :: footer}"></div>
<script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
