<!DOCTYPE html>
<html lang="en" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" th:href="@{/img/icon.png}">
    <title th:text="#{page.faq_title}">FAQ - EduFlow</title>
    <meta name="description" th:content="#{faq.subtitle}" content="Help and frequently asked questions">
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <link th:href="@{/vendor/icofont/icofont.min.css}" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/cdn.jsdelivr.net/npm/bootstrap-icons%401.7.1/font/bootstrap-icons.css}">
</head>
<body class="bg-light">
<div th:replace="~{layouts/layout :: header_2}"></div>
<header class="py-5 bg-primary text-center text-white">
    <div class="container py-4">
        <h1 class="display-5 fw-bold" th:text="#{faq.title}">Frequently asked questions</h1>
        <p class="lead text-white-50 mb-0" th:text="#{faq.subtitle}">Find quick answers about EduFlow.</p>
    </div>
</header>
<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-9">
            <div class="accordion shadow-sm" id="faqAccordion">
                <div class="accordion-item" th:each="number : ${#numbers.sequence(1, 6)}">
                    <h2 class="accordion-header" th:id="'faqHeading' + ${number}">
                        <button class="accordion-button" th:classappend="${number != 1} ? 'collapsed'" type="button"
                                data-bs-toggle="collapse" th:data-bs-target="'#faqAnswer' + ${number}"
                                th:aria-expanded="${number == 1}" th:aria-controls="'faqAnswer' + ${number}"
                                th:text="#{__${'faq.q' + number}__}">Question</button>
                    </h2>
                    <div class="accordion-collapse collapse" th:classappend="${number == 1} ? 'show'"
                         th:id="'faqAnswer' + ${number}" th:aria-labelledby="'faqHeading' + ${number}"
                         data-bs-parent="#faqAccordion">
                        <div class="accordion-body" th:text="#{__${'faq.a' + number}__}">Answer</div>
                    </div>
                </div>
            </div>
            <div class="text-center mt-5">
                <p class="mb-3" th:text="#{faq.more_help}">Still need help?</p>
                <a class="btn btn-primary" th:href="@{/contact}" th:text="#{faq.contact_us}">Contact us</a>
            </div>
        </div>
    </div>
</main>
<div th:replace="~{layouts/layout :: footer}"></div>
<script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
