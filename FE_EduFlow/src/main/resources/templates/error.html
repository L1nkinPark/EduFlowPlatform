<!DOCTYPE html>
<html lang="vi" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{error.generic_page_title}">EduFlow - Request unavailable</title>
</head>
<body>
<main style="max-width: 680px; margin: 12vh auto; padding: 24px; font-family: Arial, sans-serif; text-align: center;">
    <h1 th:text="${statusCode}">500</h1>
    <h2 th:text="#{error.generic_title}">The request cannot be processed</h2>
    <p th:text="${errorMessage}">Please try again later.</p>
    <p><a th:href="@{/}" th:text="#{error.back_home}">Back to home</a></p>
</main>
</body>
</html>
