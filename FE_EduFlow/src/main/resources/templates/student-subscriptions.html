<!DOCTYPE html>
<html lang="en" th:lang="${#locale.language}" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" th:href="@{/img/icon.png}">
    <title>My Courses - EduFlow</title>

    <link th:href="@{/css/style.css}" rel="stylesheet">
    <link th:href="@{/vendor/icofont/icofont.min.css}" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/cdn.jsdelivr.net/npm/bootstrap-icons%401.7.1/font/bootstrap-icons.css}">
</head>
<body class="bg-light">
<div th:replace="~{layouts/layout :: header_2}"></div>

<section class="py-3 border-bottom bg-white shadow-sm">
    <div class="container">
        <h4 class="mb-0" th:text="#{nav.my_courses}">My Purchased Courses</h4>
        <p class="text-muted mb-0" th:text="#{sub.purchased_desc}">Here is the list of courses you have successfully purchased and connected.</p>
    </div>
</section>

<div class="pt-5 pb-5">
    <div class="container">
        <div class="row">
            <div class="col-lg-3 col-md-4 col-sm-12">
                <div th:replace="~{layouts/layout :: student_sidebar(active='subscription')}"></div>
            </div>
            <div class="col-lg-9 col-md-8 col-sm-12">
                <div class="border-0 card shadow-sm">
                    <div class="card-body">
                        <div class="row row-cols-1 row-cols-md-2 g-4" th:if="${not #lists.isEmpty(purchasedCourses)}">
                            <div class="col" th:each="course : ${purchasedCourses}">
                                <div class="card h-100 border rounded-3 overflow-hidden shadow-sm position-relative">
                                    <img th:src="${course.image}" class="card-img-top" alt="Course Image" style="height: 180px; object-fit: cover;">
                                    <div class="card-body">
                                        <h5 class="card-title text-black fw-bold mb-2" th:text="${course.courseName}">Course Name</h5>
                                        <p class="card-text text-muted small" th:text="${course.description}">Description</p>
                                        <div class="d-flex justify-content-between align-items-center mt-3 pt-2 border-top">
                                            <span class="text-success fw-bold"><i class="bi bi-patch-check-fill me-1"></i> <span th:text="#{subscription.purchased}">Purchased</span></span>
                                            <span class="badge"
                                                  th:classappend="${courseProgressMap.containsKey(course.courseId) && courseProgressMap.get(course.courseId) == 100} ? 'bg-success' : 'bg-primary'"
                                                  th:text="${courseProgressMap.containsKey(course.courseId) && courseProgressMap.get(course.courseId) == 100} ? #{subscription.completed} : #{subscription.in_progress}">In progress</span>
                                        </div>
                                        <div class="mt-3 pt-2 border-top">
                                            <div class="d-flex justify-content-between mb-1 small text-muted">
                                                <span th:text="#{subscription.progress}">Learning progress</span>
                                                <span th:text="${courseProgressMap.containsKey(course.courseId) ? courseProgressMap.get(course.courseId) + '%' : '0%'}">0%</span>
                                            </div>
                                            <div class="progress" style="height: 8px;">
                                                <div class="progress-bar bg-success progress-bar-striped progress-bar-animated" role="progressbar"
                                                     th:style="'width: ' + ${courseProgressMap.containsKey(course.courseId) ? courseProgressMap.get(course.courseId) : 0} + '%'"
                                                     th:aria-valuenow="${courseProgressMap.containsKey(course.courseId) ? courseProgressMap.get(course.courseId) : 0}"
                                                     aria-valuemin="0" aria-valuemax="100"></div>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="card-footer bg-light border-0 p-3">
                                        <a th:href="@{/course/learn(courseId=${course.courseId})}" class="btn btn-primary btn-sm w-100">
                                            <i class="bi bi-play-fill me-1"></i>
                                            <span th:text="${courseProgressMap.containsKey(course.courseId) && courseProgressMap.get(course.courseId) > 0} ? #{subscription.continue} : #{subscription.start}">Start learning</span>
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="text-center py-5" th:if="${#lists.isEmpty(purchasedCourses)}">
                            <p class="text-muted mb-3" th:text="#{sub.no_courses}">You have not purchased any courses yet.</p>
                            <a th:href="@{/course/all}" class="btn btn-outline-primary btn-sm" th:text="#{sub.explore}">Explore Courses</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<footer class="py-4 bg-white border-top text-center small text-muted">
    <div class="container">©2026 EduFlow</div>
</footer>

<script th:src="@{/vendor/jquery/jquery.min.js}"></script>
<script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
