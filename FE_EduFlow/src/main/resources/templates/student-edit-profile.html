<!DOCTYPE html>
<html lang="en" th:lang="${#locale.language}" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" th:href="@{/img/icon.png}">
    <title th:text="#{student.edit_profile}">Edit Profile</title>
    <meta name="description" content="EduFlow" />

    <link th:href="@{/css/style.css}" rel="stylesheet">
    <link th:href="@{/vendor/icofont/icofont.min.css}" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/cdn.jsdelivr.net/npm/bootstrap-icons%401.7.1/font/bootstrap-icons.css}">
</head>
<body class="bg-light">
<div th:replace="~{layouts/layout :: header_2}"></div>

<section class="py-3 border-bottom bg-white shadow-sm">
    <div class="container">
        <h4 class="mb-0" th:text="#{student.edit_profile}">Edit Profile</h4>
        <p class="text-muted mb-0" th:text="#{student.edit_profile_desc}">Update your personal information</p>
    </div>
</section>

<div class="pt-5 pb-5">
    <div class="container">
        <div class="row">
            <div class="col-lg-3 col-md-4 col-sm-12">
                <div th:replace="~{layouts/layout :: student_sidebar(active='edit')}"></div>
            </div>
            <div class="col-lg-9 col-md-8 col-sm-12">
                <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                <div class="border-0 card">
                    <div class="card-header">
                        <h3 class="mb-0" th:text="#{student.personal_details}">Personal Details</h3>
                        <p class="mb-0" th:text="#{student.account_details}">Your account information.</p>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/student/edit}" th:object="${profile}" method="post">
                            <div class="row">
                                <div class="mb-3 col-md-6 col-sm-12">
                                    <label class="form-label" th:text="#{common.username}">Username</label>
                                    <input type="text" class="form-control" th:value="${account.username}" disabled>
                                </div>
                                <div class="mb-3 col-md-6 col-sm-12">
                                    <label class="form-label" th:text="#{common.email}">Email</label>
                                    <input type="text" class="form-control" th:value="${account.email}" disabled>
                                </div>
                                <div class="mb-3 col-md-6 col-sm-12">
                                    <label class="form-label" th:text="#{common.full_name}">Full name</label>
                                    <input type="text" class="form-control" th:field="*{fullName}" required>
                                </div>
                                <div class="mb-3 col-md-6 col-sm-12">
                                    <label class="form-label" th:text="#{common.phone}">Phone number</label>
                                    <input type="text" class="form-control" th:field="*{phone}" th:placeholder="#{common.not_updated}">
                                </div>
                                <div class="mb-3 col-md-6 col-sm-12">
                                    <label class="form-label" th:text="#{common.birthday}">Date of birth</label>
                                    <input type="date" class="form-control" th:field="*{birthday}">
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary" th:text="#{student.update_profile}">Update Profile</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<footer class="py-4 bg-white border-top text-center small text-muted">
    <div class="container">©2026 EduFlow</div>
</footer>

<script th:src="@{/vendor/jquery/jquery.min.js}"></script>
<script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
