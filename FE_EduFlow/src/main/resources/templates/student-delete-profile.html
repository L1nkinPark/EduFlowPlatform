<!DOCTYPE html>
<html lang="en" th:lang="${#locale.language}" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" th:href="@{/img/icon.png}">
    <title th:text="#{student.delete_profile}">Delete Profile</title>

    <link th:href="@{/css/style.css}" rel="stylesheet">
    <link th:href="@{/vendor/icofont/icofont.min.css}" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/cdn.jsdelivr.net/npm/bootstrap-icons%401.7.1/font/bootstrap-icons.css}">
</head>
<body class="bg-light">
<div th:replace="~{layouts/layout :: header_2}"></div>

<section class="py-3 border-bottom bg-white shadow-sm">
    <div class="container">
        <h4 class="mb-0" th:text="#{student.delete_profile}">Delete Profile</h4>
        <p class="text-muted mb-0" th:text="#{student.delete_profile_desc}">Permanently close your account</p>
    </div>
</section>

<div class="pt-5 pb-5">
    <div class="container">
        <div class="row">
            <div class="col-lg-3 col-md-4 col-sm-12">
                <div th:replace="~{layouts/layout :: student_sidebar(active='delete')}"></div>
            </div>
            <div class="col-lg-9 col-md-8 col-sm-12">
                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                <div class="border-0 card">
                    <div class="card-body">
                        <span class="text-danger h4" th:text="#{student.delete_warning_title}">Warning</span>
                        <p th:text="#{student.delete_warning(${purchasedCount})}">Closing your account removes access to purchased courses.</p>
                        <form th:action="@{/student/delete}" method="post"
                              th:attr="data-confirm=#{student.delete_confirm}"
                              onsubmit="return confirm(this.dataset.confirm);">
                            <button type="submit" class="btn btn-outline-danger btn-sm" th:text="#{student.close_account}">Close My Account</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<footer class="py-4 bg-white border-top text-center small text-muted">
    <div class="container">©2026 Edutree</div>
</footer>

<script th:src="@{/vendor/jquery/jquery.min.js}"></script>
<script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
