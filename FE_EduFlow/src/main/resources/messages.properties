faq.title=Frequently asked questions
faq.subtitle=Find quick answers about learning and managing your EduFlow account.
faq.q1=How do I enroll in a course?
faq.a1=Open a course detail page, review its content and price, then choose Enroll. After payment is confirmed, the course appears in My Courses.
faq.q2=How long can I access a purchased course?
faq.a2=Purchased courses remain available in your account unless the course page clearly states a different access period.
faq.q3=How do I track my learning progress?
faq.a3=Open My Courses, select a course and mark lessons complete as you learn. EduFlow updates your progress automatically.
faq.q4=I forgot my password. What should I do?
faq.a4=Choose Forgot password on the sign-in page, verify your registered email with the one-time code and create a new password.
faq.q5=How can I update or delete my account?
faq.a5=Sign in and open account settings. You can update your profile, change your password or deactivate your account there.
faq.q6=How do I contact an instructor or EduFlow support?
faq.a6=Use the Contact page for support. Include the course name and a clear description so the team can help quickly.
faq.more_help=Still need help?
