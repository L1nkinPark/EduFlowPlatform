privacy.title=Privacy policy
privacy.updated=Last updated: August 2026
privacy.intro=This policy explains what personal data EduFlow collects, why it is used and the choices available to you.
privacy.s1.title=1. Information we collect
privacy.s1.text=We may collect account details, profile information, course activity, support messages, order records and technical data needed to operate the platform.
privacy.s2.title=2. How we use information
privacy.s2.text=We use data to provide accounts and courses, process orders, track learning progress, send essential notifications, prevent abuse and improve EduFlow.
privacy.s3.title=3. Cookies and sessions
privacy.s3.text=Essential cookies keep you signed in, preserve language preferences and protect sessions. Browser settings can remove cookies, but some features may stop working.
privacy.s4.title=4. Sharing and service providers
privacy.s4.text=Data is shared only with providers required for hosting, email and payment processing, or when required by law. EduFlow does not sell personal data.
privacy.s5.title=5. Storage and retention
privacy.s5.text=We retain information only as long as needed for the service, legal obligations, dispute resolution and fraud prevention, then delete or anonymize it.
privacy.s6.title=6. Security
privacy.s6.text=EduFlow applies access controls, password hashing and encrypted connections where available. No internet service can guarantee absolute security.
privacy.s7.title=7. Your rights
privacy.s7.text=You may request access, correction or deletion of your personal data and may deactivate your account, subject to legal retention requirements.
privacy.s8.title=8. Children and policy changes
privacy.s8.text=Users must meet the minimum age required by applicable law. Material policy changes will be published on this page with an updated date.
privacy.contact_title=Contact and privacy requests
privacy.contact_text=For privacy questions or requests, use the contact form.
privacy.contact_link=Contact EduFlow
terms.title=Terms and conditions
terms.updated=Last updated: August 2026
terms.intro=These terms govern access to EduFlow. By creating an account or using the platform, you agree to follow them.
terms.s1.title=1. Accounts
terms.s1.text=Provide accurate information, keep your credentials confidential and notify EduFlow if you suspect unauthorized access. You are responsible for activity under your account.
terms.s2.title=2. Courses and access
terms.s2.text=Course descriptions, prices and included materials are shown before enrollment. Access is personal and may not be transferred or shared without permission.
terms.s3.title=3. Orders and payments
terms.s3.text=Payments are processed by the displayed payment provider. An enrollment is confirmed only after EduFlow receives a successful payment confirmation.
terms.s4.title=4. Acceptable use
terms.s4.text=Do not disrupt the platform, bypass access controls, scrape protected data, upload harmful content, impersonate others or violate applicable law.
terms.s5.title=5. User and instructor content
terms.s5.text=You retain ownership of content you submit and grant EduFlow the limited rights needed to host and display it. Content must respect third-party rights.
terms.s6.title=6. Intellectual property
terms.s6.text=EduFlow software, branding and platform materials are protected. Course materials may be used only for personal learning unless the owner grants additional rights.
terms.s7.title=7. Suspension and termination
terms.s7.text=EduFlow may restrict or terminate access for serious or repeated violations. You may deactivate your account from account settings.
terms.s8.title=8. Availability and liability
terms.s8.text=We work to keep EduFlow reliable but cannot promise uninterrupted availability. Liability is limited to the extent permitted by applicable law.
terms.s9.title=9. Changes and governing law
terms.s9.text=Updated terms will be published on this page. These terms are governed by the laws of Vietnam, subject to applicable consumer protections.
terms.contact_title=Questions about these terms
terms.contact_text=If anything is unclear, contact us before using the service.
terms.contact_link=Contact EduFlow
