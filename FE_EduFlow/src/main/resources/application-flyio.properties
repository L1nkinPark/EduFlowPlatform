# ==============================================================================
# EduFlow Frontend – Fly.io Profile
# ==============================================================================
# Activated via: SPRING_PROFILES_ACTIVE=flyio
# ==============================================================================

spring.application.name=frontend

# Server
server.port=${SERVER_PORT:8080}
server.forward-headers-strategy=framework
payment.return-origin=${PAYMENT_RETURN_ORIGIN:}

# Instructor media uploads (course covers up to 5 MB, lesson documents up to 25 MB).
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=27MB
media.local-directory=${MEDIA_LOCAL_DIRECTORY:./uploads}

# Misc
spring.main.banner-mode=off
spring.jpa.hibernate.ddl-auto=update

# Logging
logging.level.root=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN

# Mail – Override via Fly Secrets
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.default-encoding=UTF-8

# Cloudinary – Override via Fly Secrets
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api_key=${CLOUDINARY_API_KEY:}
cloudinary.api_secret=${CLOUDINARY_API_SECRET:}
cloudinary.secure=true

# Must match the backend JWT_SECRET.
jwt.secret=${JWT_SECRET:}

# Spring i18n messages
spring.messages.basename=messages
spring.messages.encoding=UTF-8
