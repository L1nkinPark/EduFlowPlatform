spring.application.name=frontend

server.port=8080

# Never expose the HTTP session identifier in rendered URLs. First-time
# visitors may not have accepted JSESSIONID yet, so Tomcat's default fallback
# would otherwise append ;jsessionid=... to every link on the page.
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Fail fast when the backend is unavailable instead of holding a browser request
# until the proxy returns a generic 500 page.
backend.connect-timeout=${BACKEND_CONNECT_TIMEOUT:3s}
backend.read-timeout=${BACKEND_READ_TIMEOUT:10s}

# Instructor media uploads (course covers up to 5 MB, lesson documents up to 25 MB).
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=27MB
media.local-directory=${MEDIA_LOCAL_DIRECTORY:./uploads}

spring.main.banner-mode=off

logging.level.root=warn

spring.jpa.hibernate.ddl-auto=update

logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.servlet=DEBUG
#

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.default-encoding=UTF-8



